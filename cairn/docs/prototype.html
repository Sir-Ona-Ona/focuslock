      <li>If Leroo already has an in-market route, the outside view in section 7 does not apply
        and action 4 changes shape.</li>
      <li>If the missed reviews were a bounded period rather than a pattern, ignore the second
        paragraph of section 6 entirely.</li>
      <li>If there is income protection in place that is simply not recorded here, the first
        coverage gap is a data problem rather than a plan problem.</li>
    </ul>`)}

    <div class="traced">
      Every figure traces to the rules engine: load audit, money audit over 24 months, slippage
      counts, dependency propagation, cadence counts. A review citing a number the engine did not
      compute does not publish.
    </div>
  </div>

  <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
    <button class="btn" data-runreview="0">Close</button>
    <button class="btn" data-noop="1">Publish as artifact</button>
    <button class="btn" data-noop="1">Take to the quarterly session</button>
  </div>`;
}

function sec(n, body){
  const s = REVIEW_SECTIONS[n-1];
  return `<div class="rsec"><div class="rsecn"><span>${s.n}</span><h3>${esc(s.h)}</h3></div>
    ${body}</div>`;
}

function actCard(a){
  const st = actionState.get(a.rank);
  return `<div class="act">
    <div class="rk">${a.rank}</div>
    <div>
      <h4>${esc(a.title)}</h4>
      <div class="actmeta">
        <div><b>Costs</b>${esc(a.cost)}</div>
        <div><b>Forecloses</b>${esc(a.forecloses)}</div>
        <div><b>Why here</b>${esc(a.why)}</div>
        <div><b>When</b>${esc(a.when)}</div>
      </div>
      ${st ? `<div class="tiny faint" style="margin-top:10px">${st === 'accepted'
          ? 'Accepted. Opens the milestone form prefilled, citing this review.'
          : 'Declined, with the reason recorded.'}</div>`
        : `<div class="actbtns">
            <button class="btn sm pri" data-act="${a.rank}" data-v="accepted">Accept</button>
            <button class="btn sm" data-act="${a.rank}" data-v="declined">Decline</button>
          </div>`}
    </div>
  </div>`;
}

/* ===================== MONEY ===================== */
function vMoney(){
  const a = moneyAudit();
  const maxY = Math.max(...a.rows.map(r => Math.max(r.total, r.inc))) * 1.06;
  const grid = a.rows.map((r,i) => {
    const showLab = i % 3 === 0 || r.gap > 0;
    return `<div class="mcol">
      <div class="mstack">
        <div class="mline" style="bottom:${(r.inc/maxY*100).toFixed(2)}%"
          title="income ${fmtM(r.inc)}"></div>
        ${r.one ? `<div class="mbar one hit" style="height:${(r.one/maxY*100).toFixed(2)}%"
          data-tip="mon:${r.mk}"></div>` : ''}
        <div class="mbar ${r.gap>0?'over':''} hit" style="height:${(r.rec/maxY*100).toFixed(2)}%"
          data-tip="mon:${r.mk}"></div>
      </div>
      <div class="mlab ${r.gap>0?'hit':''}">${showLab ? fmtYM(r.mk).replace(' 20',' ') : ''}</div>
    </div>`;
  }).join('');

  return `<h1 class="page">Money</h1>
  <p class="lede">What goes out against what comes in, month by month, for two years.
  The same audit the health block runs on hours. A plan can exceed either capacity, and one
  audited on only one of them is half audited.</p>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="tile"><div class="k">Committed recurring, peak</div>
      <div class="v ${a.ratio>0.6?'alert':''}">${Math.round(a.ratio*100)}<span style="font-size:.9rem;color:var(--ink-muted)">%</span></div>
      <div class="n">of income in ${fmtYM(a.ratioAt)}, before any one-off</div></div>
    <div class="tile"><div class="k">Months short, next 24</div>
      <div class="v ${a.short.length?'alert':''}">${a.short.length}</div>
      <div class="n">${a.short.length ? `worst is ${fmtYM(a.peak.mk)}` : 'none'}</div></div>
    <div class="tile"><div class="k">Reserve</div>
      <div class="v">${(MONEY.reserve.o.months + MONEY.reserve.l.months).toFixed(1)}<span style="font-size:.9rem;color:var(--ink-muted)"> mo</span></div>
      <div class="n">combined, target 6 each</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="cardhd"><h2>24 month schedule</h2>
      <span class="sub">line is income &middot; bars are outflow</span></div>
    <div class="legend" style="margin-bottom:6px">
      <span><i class="lgsw" style="background:var(--track-j);opacity:.45;border-radius:2px"></i>Recurring</span>
      <span><i class="lgsw" style="background:var(--track-o);opacity:.75;border-radius:2px"></i>One-off</span>
      <span><i class="lgsw" style="background:var(--st-crit);border-radius:2px"></i>Month is short</span>
      <span><i class="lgsw" style="background:var(--ink);height:2px;border-radius:0"></i>Income</span>
    </div>
    <div class="scrollx"><div class="mgrid">${grid}</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="cardhd"><h2>Shortfall months</h2><span class="sub">named, with three numbers</span></div>
      ${a.short.length ? a.short.map(r => `<div class="shortrow">
        <b>${fmtYM(r.mk)}</b>
        <span class="n" title="lands">${fmtM(r.total)}</span>
        <span class="n" title="comes in">${fmtM(r.inc)}</span>
        <span class="n gap">${fmtM(r.gap)} short</span>
        <span class="tiny faint">${r.items.map(i=>esc(i.label)).join(', ') || 'recurring only'}</span>
      </div>`).join('') : '<div class="tiny muted">No month in the next 24 is short.</div>'}
      <p class="tiny faint" style="margin-top:13px">What lands, what comes in, the shortfall.
      Never a ratio, and never "things look tight". The point of the detector is a sentence you
      can act on.</p>
    </div>

    <div class="card">
      <div class="cardhd"><h2>What the money rules found</h2></div>
      ${a.stacked.map(([q,items])=>`<div class="itemline"><span class="ref">F-3</span><span>
        <b>${q}</b> carries ${items.length} one-offs each above a month of income:
        ${items.map(i=>esc(i.label)).join(' and ')}.<br>
        <span class="tiny faint">Two large one-offs in one quarter is the most common way an
        affordable plan turns out not to be.</span></span></div>`).join('')}
      ${a.assumed.filter(s=>!s.built).map(s=>`<div class="itemline"><span class="ref">F-5</span><span>
        <b>${esc(s.label)}</b> is assumed income with nothing building it.<br>
        <span class="tiny faint">A plan that only works on income nobody committed to producing.</span>
      </span></div>`).join('')}
      ${a.assumed.filter(s=>s.built).map(s=>`<div class="itemline"><span class="ref">OK</span><span>
        <b>${esc(s.label)}</b> is assumed, and ${s.builtBy} is building it.<br>
        <span class="tiny faint">If that milestone slips, this income slips with it.</span>
      </span></div>`).join('')}
      <div class="itemline"><span class="ref">F-6</span><span>
        <b>${Math.round(a.foreignShare*100)}% of committed outflow is in CAD</b>, earned in NGN,
        governed by A-J-FIN-02 at ${MONEY.fx.CAD} per unit.<br>
        <span class="tiny faint">That assumption is confidence low. A 20 percent move against you
        adds roughly ${fmtM(a.foreign.reduce((x,o)=>x+o.amount,0)*0.2)} to the relocation total.
        This is an FX position whether or not anyone called it one.</span></span></div>
    </div>
  </div>`;
}

/* ===================== ROUTER + EVENTS ===================== */
function render(){
  const v = document.getElementById('view');
  let html;
  switch(route){
    case 't-o':     html = vTrack('o'); break;
    case 't-l':     html = vTrack('l'); break;
    case 'joint':   html = vTrack('j'); break;
    case 'timeline':html = vTimeline(); break;
    case 'decision':html = vDecision(); break;
    case 'session': html = vSession(); break;
    case 'logs':    html = vLogs(); break;
    case 'members': html = vMembers(); break;
    case 'findings':html = vFindings(); break;
    case 'money':   html = vMoney(); break;
    case 'review':  html = vReview(); break;
    case 'decisions':html = vDecisions(); break;
    case 'method':  html = vMethod(); break;
    default:        html = vHome();
  }
  v.innerHTML = html;
  const sh = document.getElementById('sheet'); if(sh){ sh.hidden = true; }
  v.scrollIntoView ? window.scrollTo(0,0) : null;
  renderNav(); renderViewerSeg(); save();
}

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = '1';
  const r = tip.getBoundingClientRect();
  let left = e.clientX + 14, top = e.clientY + 14;
  if(left + r.width > innerWidth - 10) left = e.clientX - r.width - 14;
  if(top + r.height > innerHeight - 10) top = e.clientY - r.height - 14;
  tip.style.left = left + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
function hideTip(){ tip.style.opacity = '0'; }

function tipHtml(key){
  const [kind, id] = key.split(':');
  if(kind === 'ms'){
    const m = byId(id); if(!m) return '';
    const deps = DEPS.filter(d=>d.from===id||d.to===id);
    return `<h4>${esc(m.title)}</h4>
      <span class="r">${m.id} &middot; ${trackName(m.t)} &middot; ${fmtYM(m.target)}</span>
      <div style="margin-top:6px">${m.t==='j'&&m.agree==='proposed'?'':pill(m.s)} ${agreePill(m)}</div>
      ${m.note?`<div style="margin-top:6px;color:var(--ink-muted)">${esc(m.note)}</div>`:''}
      ${(m.moves||[]).length>1?`<div style="margin-top:6px;color:var(--st-crit);font-family:var(--mono);font-size:.68rem">moved ${m.moves.length-1}&times;: ${m.moves.map(fmtYM).join(' &rarr; ')}</div>`:''}
      ${deps.length?`<div style="margin-top:6px;color:var(--ink-faint);font-size:.72rem">${deps.map(d=>
        d.from===id?`blocks ${d.to} (${d.nature})`:`waits on ${d.from} (${d.nature})`).join('<br>')}</div>`:''}`;
  }
  if(kind === 'collision'){
    const c = COLLISIONS.find(c=>c.id===id); if(!c) return '';
    const age = daysBetween(dstr(c.opened), TODAY);
    return `<h4>${esc(c.tension)}</h4>
      <span class="r">${c.id} &middot; ${c.kind} gap &middot; open ${age} days</span>
      <div style="margin-top:6px;color:var(--ink-muted)">${fmtYM(c.from)} to ${fmtYM(c.to)},
      ${c.tracks.map(trackName).join(' and ')}</div>`;
  }
  if(kind === 'mon'){
    const a = moneyAudit(), r = a.rows.find(x => x.mk === id);
    if(!r) return '';
    return `<h4>${fmtYM(r.mk)}</h4>
      <span class="r">${r.gap > 0 ? 'short by ' + fmtM(r.gap) : 'covered'}</span>
      <div style="margin-top:6px;color:var(--ink-muted)">
        recurring ${fmtM(r.rec)}${r.one ? ` &middot; one-off ${fmtM(r.one)}` : ''}<br>
        income ${fmtM(r.inc)}</div>
      ${r.items.length ? `<div style="margin-top:6px;font-size:.72rem;color:var(--ink-faint)">${
        r.items.map(i=>esc(i.label)).join('<br>')}</div>` : ''}`;
  }
  if(kind === 'gate'){
    const g = GATES.find(g=>g.id===id); if(!g) return '';
    return `<h4>${esc(g.title)}</h4>
      <span class="r">${g.id} &middot; decide by ${g.by}</span>
      <div style="margin-top:6px;color:var(--ink-muted)">${g.brief?`Brief ${g.brief} exists.`:'No brief written yet.'}</div>`;
  }
  return '';
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-route]');
  if(nav){ route = nav.dataset.route; render(); return; }

  const vw = e.target.closest('[data-viewer]');
  if(vw){ viewer = vw.dataset.viewer; render(); return; }

  const tl = e.target.closest('[data-tl]');
  if(tl){ tlFilter = tl.dataset.tl; render(); return; }

  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const code = tg.dataset.toggle;
    openDoms.has(code) ? openDoms.delete(code) : openDoms.add(code);
    render(); return;
  }

  const ag = e.target.closest('[data-agree]');
  if(ag){
    const m = byId(ag.dataset.agree), v = ag.dataset.v;
    if(m){
      m.hist = m.hist || [];
      if(v === 'agreed'){ m.agree = 'agreed'; m.hist.push({e:'Agreed', who:viewer, at:'2026-08-25'}); }
      else if(v === 'edit'){ m.hist.push({e:'Edit proposed', who:viewer, at:'2026-08-25'}); }
      else { m.hist.push({e:'Sent to session', who:viewer, at:'2026-08-25'}); }
    }
    render(); return;
  }

  const me2 = e.target.closest('[data-medit]');
  if(me2){ methodEdit = {k: me2.dataset.medit}; render(); return; }
  if(e.target.closest('[data-mcancel]')){ methodEdit = null; render(); return; }
  const mw = e.target.closest('[data-mwithdraw]');
  if(mw){ const i = methodRequests.findIndex(r => r.k === mw.dataset.mwithdraw);
    if(i >= 0) methodRequests.splice(i,1); render(); return; }
  const ms = e.target.closest('[data-msave]');
  if(ms){
    const k = ms.dataset.msave, two = ms.dataset.two === '1';
    const f0 = document.getElementById('mf0'), f1 = document.getElementById('mf1');
    const reason = (f1 && f1.value.trim()) || '';
    if(!reason){ f1.focus(); f1.style.borderColor = 'var(--st-crit)'; return; }
    let item = null;
    METHOD.groups.forEach(g => g.items.forEach(x => { if(x.k === k) item = x; }));
    if(two){
      methodRequests.push({k, label:item.label, reason, at:'2026-08-25',
        by:viewer, status:'pending'});
    } else {
      item.v = f0.value;
      METHOD.version += 1;
      METHOD.history.unshift({v:METHOD.version, at:'2026-08-25', by:viewer, note:reason});
    }
    methodEdit = null; render(); return;
  }

  const rz = e.target.closest('[data-resolve]');
  if(rz){
    const kind = rz.dataset.kind;
    if(kind === 'decide'){
      DEC2.from = rz.dataset.resolve; route = 'decisions'; resolveMode = null; render(); return;
    }
    resolveMode = {id: rz.dataset.resolve, kind}; render(); return;
  }
  if(e.target.closest('[data-rcancel]')){ resolveMode = null; render(); return; }
  const rs = e.target.closest('[data-rsave]');
  if(rs){
    const f1 = document.getElementById('rf1'), f2 = document.getElementById('rf2'),
          f3 = document.getElementById('rf3');
    const c = COLLISIONS.find(x => x.id === resolveMode.id);
    if(rs.dataset.rsave === 'accept'){
      c.status = 'accepted';
      resolutionLog.push({id:c.id, verb:'accepted', at:'2026-08-25', by:viewer,
        detail:`Cost accepted: ${f1.value} Carried by ${f2.value==='j'?'both, split':MEMBERS[f2.value].name}.`});
    } else {
      c.nextStep = f1.value; c.nextOwner = f2.value; c.nextDue = f3.value;
      resolutionLog.push({id:c.id, verb:'left open with a next step', at:'2026-08-25', by:viewer,
        detail:`${f1.value}. Owner ${MEMBERS[f2.value].name}, due ${f3.value}.`});
    }
    resolveMode = null; render(); return;
  }

  const rr = e.target.closest('[data-runreview]');
  if(rr){ reviewRun = rr.dataset.runreview === '1'; route = 'review'; render(); return; }

  const ac = e.target.closest('[data-act]');
  if(ac){ actionState.set(+ac.dataset.act, ac.dataset.v); render(); return; }

  const dm = e.target.closest('[data-dismiss]');
  if(dm){ dismissed.set(dm.dataset.dismiss, dm.dataset.reason); render(); return; }

  if(e.target.closest('[data-wreset]')){
    liveW.o = {...DEC.weights.o}; liveW.l = {...DEC.weights.l};
    render(); return;
  }
  if(e.target.closest('[data-privlog]')){ route = 'members'; render(); return; }
  if(e.target.closest('[data-addmember]')){
    alert('Adding a member beyond the second needs both principals to act.\n\nIn the built app this opens a request that the other principal has to approve, and shows the one-time note about what changes when a third person can see the plan.');
    return;
  }
});

document.addEventListener('input', e => {
  const w = e.target.closest('[data-w]');
  if(!w) return;
  liveW[viewer][w.dataset.w] = +w.value;
  render();
  const again = document.querySelector(`[data-w="${w.dataset.w}"]`);
  if(again) again.focus();
});

/* hover is the optional desktop convenience. Tap and keyboard are the real path. */
const sheet = document.getElementById('sheet');
let sheetKey = null;
function openSheet(key, anchor){
  const html = tipHtml(key); if(!html) return;
  sheetKey = key;
  sheet.innerHTML = `<button class="close" data-sheetclose="1" aria-label="Close">&times;</button>${html}`;
  sheet.hidden = false;
  hideTip();
  if(window.innerWidth > 700 && anchor){
    const r = anchor.getBoundingClientRect(), s = sheet.getBoundingClientRect();
    let left = Math.min(r.left + 18, innerWidth - s.width - 12);
    let top  = Math.min(r.top + 14, innerHeight - s.height - 12);
    sheet.style.left = Math.max(12, left) + 'px';
    sheet.style.top  = Math.max(12, top) + 'px';
  } else {
    sheet.style.left = ''; sheet.style.top = '';
  }
  const c = sheet.querySelector('.close'); if(c) c.focus();
}
function closeSheet(){ sheet.hidden = true; sheetKey = null; }

document.addEventListener('mouseover', e => {
  if(!sheet.hidden) return;
  const h = e.target.closest('.hit');
  if(h && h.dataset.tip){ const html = tipHtml(h.dataset.tip); if(html) showTip(e, html); }
});
document.addEventListener('mousemove', e => {
  if(!sheet.hidden) { hideTip(); return; }
  const h = e.target.closest('.hit');
  if(h && h.dataset.tip){ const html = tipHtml(h.dataset.tip); if(html) showTip(e, html); }
  else hideTip();
});
document.addEventListener('mouseleave', hideTip);
window.addEventListener('blur', hideTip);

document.addEventListener('click', e => {
  if(e.target.closest('[data-sheetclose]')){ closeSheet(); return; }
  const h = e.target.closest('.hit');
  if(h && h.dataset.tip){
    if(sheetKey === h.dataset.tip) closeSheet(); else openSheet(h.dataset.tip, h);
    return;
  }
  if(!sheet.hidden && !e.target.closest('#sheet')) closeSheet();
}, true);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !sheet.hidden){ closeSheet(); return; }
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const h = e.target.closest && e.target.closest('.hit');
  if(h && h.dataset.tip){
    e.preventDefault();
    if(sheetKey === h.dataset.tip) closeSheet(); else openSheet(h.dataset.tip, h);
  }
});

render();
</script>
