<title>Cairn Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
:root{
  --ground:#F4F5F2; --surface:#FFFFFF; --surface-2:#EDEFEA; --surface-3:#E4E7E0;
  --ink:#191E1C; --ink-muted:#5D6764; --ink-faint:#8A938F;
  --rule:#DCE0DA; --rule-strong:#C3C9C0;
  --brand:#35655C; --brand-soft:#E3EDEA;
  --track-o:#2a78d6; --track-l:#eb6834; --track-j:#6B7370;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --st-muted:#8A938F;
  --shadow:0 1px 2px rgba(25,30,28,.05), 0 4px 14px rgba(25,30,28,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --surface:#1B2220; --surface-2:#222B28; --surface-3:#2A3431;
    --ink:#E4E8E4; --ink-muted:#A0AAA6; --ink-faint:#79837F;
    --rule:#2E3835; --rule-strong:#3D4A46;
    --brand:#6FA79B; --brand-soft:#22322E;
    --track-o:#3987e5; --track-l:#d95926; --track-j:#97A19D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --surface:#1B2220; --surface-2:#222B28; --surface-3:#2A3431;
  --ink:#E4E8E4; --ink-muted:#A0AAA6; --ink-faint:#79837F;
  --rule:#2E3835; --rule-strong:#3D4A46;
  --brand:#6FA79B; --brand-soft:#22322E;
  --track-o:#3987e5; --track-l:#d95926; --track-j:#97A19D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{border-right:1px solid var(--rule);background:var(--surface);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
.brandbar{padding:20px 20px 16px;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:2px}
.stack i{display:block;height:2px;border-radius:2px;background:var(--brand)}
.stack i:nth-child(1){width:18px;opacity:.45}
.stack i:nth-child(2){width:13px;opacity:.75}
.stack i:nth-child(3){width:8px}
.wordmark b{font-family:var(--serif);font-size:1.22rem;font-weight:600;letter-spacing:-.01em}
.tagline{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:7px}
nav.views{padding:12px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;min-width:0}
.navgrp{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);padding:14px 10px 6px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;padding:7px 10px;border-radius:6px;color:var(--ink-muted);font-size:.9rem}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brand-soft);color:var(--ink);font-weight:500}
.navbtn .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--ink-faint)}
.navbtn .dot.o{background:var(--track-o)} .navbtn .dot.l{background:var(--track-l)}
.navbtn .dot.j{background:var(--track-j)}
.navbtn .cnt{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.navbtn .cnt.alert{color:var(--st-crit);font-weight:600}
.sidefoot{padding:12px 14px;border-top:1px solid var(--rule);font-size:.68rem;color:var(--ink-faint);
  line-height:1.4}

.main{min-width:0;max-width:100%;display:flex;flex-direction:column;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:13px 26px;border-bottom:1px solid var(--rule);
  background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.vlabel{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;font-size:.83rem;
  color:var(--ink-muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.07)}
.seg .dot{width:7px;height:7px;border-radius:50%}
.sample{margin-left:auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--rule);
  padding:3px 9px;border-radius:20px}
.wrap{padding:26px;max-width:1180px;width:100%;min-width:0}

/* ---------- generic ---------- */
h1.page{font-family:var(--serif);font-weight:600;font-size:1.7rem;letter-spacing:-.015em;margin:0 0 4px}
.lede{color:var(--ink-muted);font-size:.93rem;margin:0 0 24px;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;
  box-shadow:var(--shadow);min-width:0}
.cardhd{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cardhd h2{font-size:.95rem;font-weight:600;margin:0}
.cardhd .sub{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);margin-left:auto}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stackv{display:flex;flex-direction:column;gap:16px}
.ref{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.faint{color:var(--ink-faint)}
.tiny{font-size:.78rem}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* ---------- status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:500;
  padding:2px 9px 2px 7px;border-radius:20px;border:1px solid var(--rule-strong);
  background:var(--surface-2);color:var(--ink-muted);white-space:nowrap}
.pill .sw{width:8px;height:8px;border-radius:50%;background:var(--st-muted);flex:0 0 auto}
.pill[data-s="on_track"] .sw{background:var(--st-good)}
.pill[data-s="at_risk"] .sw{background:var(--st-warn)}
.pill[data-s="slipped"] .sw{background:var(--st-crit)}
.pill[data-s="blocked"] .sw{background:transparent;border:2px solid var(--st-serious)}
.pill[data-s="done"] .sw{background:var(--st-muted)}
.pill[data-s="parked"] .sw{background:transparent;border:2px solid var(--st-muted)}
.pill[data-s="dropped"] .sw{background:transparent;border:2px solid var(--st-muted)}
.pill[data-s="slipped"],.pill[data-s="blocked"]{border-color:var(--st-crit);color:var(--ink)}
.pill.unconf{border-style:dashed;border-color:var(--ink-faint)}
.pill.conf{border-color:var(--st-good)}
.pill.priv{border-style:dashed}

/* ---------- tables ---------- */
table.dt{border-collapse:collapse;width:100%;font-size:.86rem}
table.dt th{font-family:var(--mono);font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;text-align:left;padding:0 14px 8px 0;
  border-bottom:1px solid var(--rule-strong);white-space:nowrap}
table.dt td{padding:10px 14px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top;
  color:var(--ink-muted);font-variant-numeric:tabular-nums}
table.dt tr:last-child td{border-bottom:0}
table.dt td.nm{color:var(--ink)}
table.dt tr.ghost td{opacity:.5}

/* ---------- domain blocks ---------- */
.dom{border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.dom+.dom{margin-top:10px}
.domhd{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  padding:13px 18px;text-align:left}
.domhd:hover{background:var(--surface-2)}
.domcode{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.09em;
  color:var(--brand);width:30px;flex:0 0 auto}
.domname{font-weight:500;font-size:.92rem}
.dommeta{margin-left:auto;display:flex;align-items:center;gap:10px}
.chev{color:var(--ink-faint);font-size:.75rem;transition:transform .15s}
.dom[data-open="true"] .chev{transform:rotate(90deg)}
.dombody{padding:2px 18px 18px;border-top:1px solid var(--rule);display:none;min-width:0}
.dom[data-open="true"] .dombody{display:block}
.sect{margin-top:16px}
.secth{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:8px}
.goalrow{display:flex;gap:10px;font-size:.86rem;padding:4px 0;color:var(--ink-muted)}
.goalrow b{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);min-width:42px;padding-top:2px}
.privrow{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink-faint);
  padding:9px 11px;border:1px dashed var(--rule-strong);border-radius:7px;margin-top:10px;
  background:var(--surface-2)}
.itemline{font-size:.83rem;color:var(--ink-muted);padding:5px 0;display:flex;gap:9px}
.itemline .ref{flex:0 0 auto;padding-top:1px}
.movehist{font-size:.73rem;color:var(--st-crit);font-family:var(--mono)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:7px;
  padding:5px 12px;font-size:.8rem;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri,
:root:not([data-theme="light"]) .btn.pri{color:#0F1614}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.pri:hover{opacity:.9;background:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:.74rem}
.why{font-size:.73rem;color:var(--ink-faint);margin-top:5px;max-width:34ch}

/* ---------- stat tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;
  box-shadow:var(--shadow)}
.tile .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint)}
.tile .v{font-family:var(--serif);font-size:1.85rem;line-height:1.1;margin-top:7px;
  font-variant-numeric:tabular-nums}
.tile .n{font-size:.78rem;color:var(--ink-muted);margin-top:5px}
.tile .v.alert{color:var(--st-crit)}
.tile .v.warn{color:var(--ink)}

/* ---------- meter ---------- */
.meter{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex;
  margin-top:9px}
.meter span{display:block;height:100%}
.meter span+span{border-left:2px solid var(--surface)}
.ceilmark{position:relative;height:14px;margin-top:3px}
.ceilmark i{position:absolute;top:0;width:2px;height:8px;background:var(--ink)}
.ceilmark em{position:absolute;top:0;font-family:var(--mono);font-size:.64rem;color:var(--ink-muted);
  font-style:normal;transform:translateX(-50%);white-space:nowrap;padding-top:9px}

/* ---------- timeline ---------- */
.tlbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--ink-muted);
  align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lgsw{width:9px;height:9px;border-radius:50%}
.tlhost{border:1px solid var(--rule);border-radius:10px;background:var(--surface);
  box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:8px;padding:9px 12px;box-shadow:var(--shadow);
  font-size:.78rem;max-width:270px;opacity:0;transition:opacity .1s;line-height:1.45}
.tip b{display:block;font-size:.83rem;margin-bottom:3px}
.tip .r{font-family:var(--mono);font-size:.66rem;color:var(--ink-faint)}

/* ---------- decision ---------- */
.wgrid{width:100%;border-collapse:collapse;font-size:.84rem;min-width:640px}
.wgrid th,.wgrid td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:left;
  font-variant-numeric:tabular-nums}
.wgrid th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;border-bottom:1px solid var(--rule-strong)}
.wgrid td.num{text-align:right;font-family:var(--mono);font-size:.8rem}
.wgrid tr.tot td{border-top:1px solid var(--rule-strong);border-bottom:0;font-weight:600;
  color:var(--ink);padding-top:12px}
/* the criterion name is the column that must survive horizontal scroll */
.wgrid th:first-child,.wgrid td:first-child{position:sticky;left:0;z-index:1;
  background:var(--surface);box-shadow:1px 0 0 var(--rule)}
table.dt th:first-child,table.dt td:first-child{background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--brand)}
.wcell{display:flex;align-items:center;gap:9px;min-width:150px}
.wcell output{font-family:var(--mono);font-size:.76rem;width:26px;text-align:right;
  color:var(--ink);font-variant-numeric:tabular-nums}
.budget{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint)}
.budget.over{color:var(--st-warn);font-weight:600}
.winner{border-left:3px solid var(--brand);padding-left:13px;margin-top:4px}
.nocombine{border:1px dashed var(--rule-strong);border-radius:8px;padding:11px 14px;
  font-size:.78rem;color:var(--ink-muted);background:var(--surface-2);margin-top:14px}

/* ---------- session ---------- */
.blocks{display:flex;flex-direction:column;gap:3px}
.blk{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;
  padding:9px 12px;border-radius:7px;border:1px solid transparent;font-size:.86rem}
.blk .bn{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint)}
.blk .bm{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.blk[data-k="break"]{background:var(--surface-2);color:var(--ink-muted);font-style:italic}
.blk[data-k="cur"]{background:var(--brand-soft);border-color:var(--brand);font-weight:500}
.blk[data-k="done"]{opacity:.5}
.gateline{display:flex;align-items:center;gap:10px;margin:7px 0;padding:8px 12px;
  border:1px dashed var(--rule-strong);border-radius:7px;font-size:.79rem;color:var(--ink-muted);
  background:var(--surface-2)}
.gateline .ref{color:var(--ink)}
.transcript{border:1px solid var(--rule);border-radius:9px;background:var(--surface-2);padding:15px 17px;
  font-size:.86rem;display:flex;flex-direction:column;gap:12px;min-width:0}
.turn p{min-width:0;overflow-wrap:anywhere}
.turn{display:flex;gap:11px}
.turn .who{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);flex:0 0 54px;padding-top:3px}
.turn p{margin:0;color:var(--ink-muted)}
.turn.sys p{color:var(--ink)}

/* ---------- findings ---------- */
.find{border:1px solid var(--rule);border-left:3px solid var(--ink-faint);border-radius:9px;
  background:var(--surface);padding:16px 18px;box-shadow:var(--shadow)}
.find+.find{margin-top:12px}
.find[data-k="pattern"]{border-left-color:var(--track-o)}
.find[data-k="critique"]{border-left-color:var(--brand)}
.find[data-k="scenario"]{border-left-color:var(--track-j)}
.find[data-k="reference"]{border-left-color:var(--st-serious);border-style:dashed;
  border-left-style:solid;background:var(--surface-2)}
.findhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.kindtag{font-family:var(--mono);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-muted);
  border:1px solid var(--rule-strong)}
.find[data-k="reference"] .kindtag{background:var(--st-serious);color:#241009;border-color:transparent}
.sev{margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.fline{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:6px 0;font-size:.86rem;
  align-items:start}
.fline dt{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding-top:4px}
.fline dd{margin:0;color:var(--ink-muted)}
.fline.obs dd{color:var(--ink)}
.fline.read dd{border-left:2px solid var(--rule-strong);padding-left:11px;font-style:italic}
.fline.dis dd{color:var(--ink-muted)}
.refbox{border:1px solid var(--st-serious);border-radius:7px;padding:11px 13px;margin-top:11px;
  font-size:.8rem;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.refbox b{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--st-serious)}
.dismiss{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--rule)}
.quiet{border:1px dashed var(--rule-strong);border-radius:8px;padding:13px 15px;
  font-size:.8rem;color:var(--ink-muted);background:var(--surface-2)}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--rule-strong);
  border-left:3px solid var(--track-o);border-radius:9px;background:var(--surface);
  padding:14px 16px;margin-bottom:20px;box-shadow:var(--shadow)}

/* ---------- money grid ---------- */
.mgrid{display:flex;gap:2px;align-items:stretch;min-width:680px;padding-top:8px}
.mcol{flex:1;display:flex;flex-direction:column;min-width:22px}
.mstack{flex:0 0 152px;height:152px;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end}
.mbar{width:100%;border-radius:3px 3px 0 0;background:var(--track-j);opacity:.45}
.mbar.over{background:var(--st-crit);opacity:.9}
.mbar.one{background:var(--track-o);opacity:.75;border-radius:3px 3px 0 0;margin-bottom:1px}
.mline{position:absolute;left:0;right:0;height:2px;background:var(--ink);z-index:2}
.mlab{font-family:var(--mono);font-size:.58rem;color:var(--ink-faint);text-align:center;
  padding-top:5px;white-space:nowrap}
.mlab.hit{color:var(--st-crit);font-weight:600}
.shortrow{display:grid;grid-template-columns:84px 62px 62px 96px 1fr;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--rule);font-size:.85rem;align-items:baseline}
.shortrow .n,.shortrow .gap{white-space:nowrap}
.shortrow b{font-family:var(--mono);font-size:.78rem}
.shortrow .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.shortrow .gap{color:var(--st-crit);font-weight:600}

/* ---------- advisory review ---------- */
.runbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--rule);
  border-radius:10px;background:var(--surface);padding:15px 18px;box-shadow:var(--shadow);
  margin-bottom:20px}
.rsec{border-top:1px solid var(--rule);padding-top:20px;margin-top:20px}
.rsec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.rsecn{display:flex;align-items:baseline;gap:11px;margin-bottom:11px}
.rsecn span{font-family:var(--mono);font-size:.66rem;color:var(--brand);font-weight:600}
.rsecn h3{margin:0;font-size:1.02rem;font-weight:600}
.verdict{font-family:var(--serif);font-size:1.16rem;line-height:1.5;color:var(--ink);
  border-left:3px solid var(--brand);padding-left:16px}
.act{display:grid;grid-template-columns:26px 1fr;gap:13px;padding:14px 0;
  border-bottom:1px solid var(--rule)}

const HORIZON = 24;
function monthKeys(){

    out.push(`${y}-${String(m+1).padStart(2,'0')}`);
    if(++m > 11){ m = 0; y++; }

function incomeFor(mk){
  let total = 0;
  for(const who of ['o','l'])
    for(const s of MONEY.income[who])
      if(!s.from || ym(mk) >= ym(s.from)) total += s.monthly;
  return total;
}
function outflowFor(mk){
  let rec = 0, one = 0, recCommitted = 0, items = [];
  for(const o of MONEY.obligations){
    if(o.kind === 'rec'){
      if(ym(mk) >= ym(o.from) && (!o.endsOn || ym(mk) <= ym(o.endsOn))){
        rec += o.amount; if(o.committed) recCommitted += o.amount;
      }
    } else if(o.on === mk){
      one += o.amount; items.push(o);
    }
  }
  return {rec, one, recCommitted, items, total: rec + one};
}
function moneyAudit(){
  const rows = MK.map(mk => {
    const inc = incomeFor(mk), out = outflowFor(mk);
    return {mk, inc, ...out, gap: out.total - inc};
  });
  const short = rows.filter(r => r.gap > 0).sort((a,b) => b.gap - a.gap);
  const nowRow = rows[0];
  const ratioRows = rows.map(r => ({mk:r.mk, v:r.recCommitted / r.inc}));
  const peakRatio = ratioRows.reduce((a,b) => b.v > a.v ? b : a);
  const ratio = peakRatio.v;
  const assumed = [];
  for(const who of ['o','l'])
    for(const s of MONEY.income[who])
      if(s.assumed) assumed.push({...s, who, built: !!s.builtBy});
  const foreign = MONEY.obligations.filter(o => o.cur && o.cur !== MONEY.reportingCurrency);
  const foreignShare = foreign.reduce((a,o) => a + o.amount, 0)
                     / MONEY.obligations.reduce((a,o) => a + o.amount, 0);
  const quarters = {};
  MONEY.obligations.filter(o => o.kind === 'one' && o.amount > nowRow.inc).forEach(o => {
    const [y,m] = o.on.split('-').map(Number);
    const q = `${y}-Q${Math.ceil(m/3)}`;
    (quarters[q] = quarters[q] || []).push(o);
  });
  const stacked = Object.entries(quarters).filter(([,v]) => v.length >= 2);
  return {rows, short, ratio, ratioAt: peakRatio.mk, assumed, foreign, foreignShare,
          stacked, peak: short[0]};
}

  return {movedTwice, movedOnce, unconf, expired, rollovers, gatesSoon, gatesNoBrief, atRisk};
}

      <span class="nrk">${i+1}</span>

  <div class="card" style="margin-bottom:16px">

    ${r.movedTwice.map(m=>sig('Repeated slip', m.id,

    ${r.expired.map(x=>sig('Stale assumption', x.id,
      `Untested past ${x.testBy}, ${x.cycles} cycles. Carries ${x.carries.join(', ')}.`,
      x.cycles>=3 ? 'Survived three cycles without a test. Treat it as unverified until evidence is added.'
                  : 'Surfaces every review until it resolves.')).join('')}
    ${r.rollovers.map(c=>sig('Commitment rollover', `×${c.rolls}`,
      `${esc(c.text)} (${MEMBERS[c.owner].name}).`,
      'Park, drop or re-scope. It cannot roll again unchanged.')).join('')}
    ${r.gatesNoBrief.map(g=>sig('Gate without brief', g.id,
      `${esc(g.title)}, decide by ${fmtYM(g.by)}.`,
      'Inside six months with nothing worked.')).join('')}
    ${a.short.length ? sig('Month short', fmtYM(a.peak.mk),
      `${fmtM(a.peak.total)} lands against ${fmtM(a.peak.inc)} of income.`,
      `Short by ${fmtM(a.peak.gap)}. ${a.short.length} such months in the next 24.`) : ''}

      <div class="hstat"><b>${r.unconf.length}</b><span>joint items proposed, not yet agreed</span></div>

        <span>months short in the next 24</span></div>

    <div class="card">
      <div class="cardhd"><h2>Your capacity</h2><span class="sub">hours per normal week</span></div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-family:var(--serif);font-size:1.85rem">${load}</span>
        <span class="muted tiny">against a stated ceiling of ${ceil}</span>
      </div>

      <p class="tiny ${gap>0?'':'muted'}" style="margin:14px 0 0;${gap>0?'color:var(--st-warn)':''}">
        ${gap>0 ? `Over by ${gap} hours. Cut a goal, move a date, reduce a scope, or raise the ceiling with a named change.`
                : `Inside the ceiling by ${-gap} hours.`}</p>
      <p class="tiny faint" style="margin:8px 0 0">Early signal: ${esc(LOAD[me].signal)}</p>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="cardhd"><h2>Upcoming decisions</h2><span class="sub">by decide-by date</span></div>
    <div class="scrollx"><table class="dt">
      <thead><tr><th>Ref</th><th>Decision</th><th>Decide by</th><th>Brief</th></tr></thead>
      <tbody>${GATES.slice().sort((x,y)=>ym(x.by)-ym(y.by)).map(g=>{
        const mo = Math.round((ym(g.by)-todayY)*12);
        return `<tr><td class="ref">${g.id}</td>
          <td class="nm">${esc(g.title)}
            <div class="tiny faint" style="margin-top:2px">${g.outcomes.join(' &middot; ')}</div></td>
          <td>${fmtYM(g.by)} <span class="tiny faint">${mo}mo</span></td>
          <td>${g.brief ? `<span class="ref">${g.brief}</span>`
            : `<span style="color:var(--st-warn)">none written</span>`}</td></tr>`;
      }).join('')}</tbody></table></div>
  </div>`;
}

function sig(kind, ref, body, rule){
  return `<div class="sigrow">
    <span class="sigk">${kind}</span>
    <span><span class="ref">${ref}</span> ${body}
      <div class="tiny faint" style="margin-top:3px">${rule}</div></span>
  </div>`;
}

function meter(who){
  const L = LOAD[who], total = loadTotal(who), ceil = L.ceiling;
  const scale = Math.max(total, ceil) * 1.12;
  const segs = DOMAINS.filter(d => L[d.code]).map((d,i) =>
    `<span title="${d.code} ${L[d.code]}h" style="width:${L[d.code]/scale*100}%;background:var(--track-${who});opacity:${1 - i*0.12}"></span>`).join('');
  return `<div class="meter">${segs}</div>
  <div class="ceilmark"><i style="left:${ceil/scale*100}%"></i>
    <em style="left:${ceil/scale*100}%">ceiling ${ceil}h</em></div>
  <div class="tiny faint" style="margin-top:22px">${DOMAINS.filter(d=>L[d.code])
    .map(d=>`${d.code} ${L[d.code]}h`).join(' &middot; ')}</div>`;
}

<script>
/* ===================== TRACK / JOINT VIEWS ===================== */
function vTrack(t){
  const isMine = t === viewer;
  const isJoint = t === 'j';
  const owner = isJoint ? null : MEMBERS[t];
  const title = isJoint ? 'Joint plan' : `${owner.name}'s track`;
  const claimed = true;

  let lede;
  if(isJoint){
    const mine = M.filter(m=>m.t==='j' && m.agree==='proposed' && m.by===viewer).length;
    const theirs = M.filter(m=>m.t==='j' && m.agree==='proposed' && m.by!==viewer).length;
    lede = `What commits both of you. An item is <b>Proposed</b> until you both agree it belongs,
      then <b>Agreed</b>, then <b>Active</b> once it is being worked. Execution status only starts
      once you agree it exists.<br>
      ${theirs} proposed by ${MEMBERS[other(viewer)].name}, waiting on you.
      ${mine} you proposed and ${MEMBERS[other(viewer)].name} has not agreed.`;
  } else if(isMine){
    lede = `Yours to author. ${MEMBERS[other(t)].name} can read it, apart from what you mark private.`;
  } else {
    lede = `${owner.name}'s to author. You can read it. You cannot change anything in it, and private items show only as a count.`;
  }

  const doms = DOMAINS.map(d => domBlock(t, d)).filter(Boolean).join('');
  return `<h1 class="page">${esc(title)}</h1><p class="lede">${lede}</p>
    ${!isJoint && !isMine ? `<div class="card" style="margin-bottom:16px;border-color:var(--rule-strong)">
      <div class="tiny muted">You are viewing as <b>${MEMBERS[viewer].name}</b>.
      Every edit control below is absent rather than disabled, because a locked button still
      tells you something exists.</div></div>` : ''}
    ${doms}`;
}

function domBlock(t, d){
  const ms = M.filter(m => m.t === t && m.d === d.code);
  const goals = (GOALS[t]||{})[d.code];
  const privCount = t !== 'j' ? (PRIVATE[t]||{})[d.code] : 0;
  const asms = ASSUMPTIONS.filter(a => a.track === t && a.d === d.code);
  if(!ms.length && !goals && !privCount) return '';
  const open = openDoms.has(d.code);
  const needs = ms.filter(m => m.agree !== 'proposed' && ['at_risk','slipped','blocked'].includes(m.s)).length;
  const unconf = ms.filter(m => m.agree === 'proposed').length;
  const isMine = t === viewer;

  return `<div class="dom" data-open="${open}" data-dom="${d.code}-${t}">
    <button class="domhd" data-toggle="${d.code}">
      <span class="domcode">${d.code}</span>
      <span class="domname">${esc(d.name)}</span>
      <span class="dommeta">
        ${needs ? `<span class="pill" data-s="at_risk"><span class="sw"></span>${needs} need attention</span>` : ''}
        ${unconf ? `<span class="pill unconf"><span class="sw" style="background:transparent;border:2px solid var(--ink-faint)"></span>${unconf} proposed</span>` : ''}
        ${privCount && isMine ? `<span class="pill priv"><span class="sw" style="background:transparent;border:2px solid var(--ink-faint)"></span>${privCount} private</span>` : ''}
        <span class="ref">${ms.length}</span>
        <span class="chev">&#9656;</span>
      </span>
    </button>
    <div class="dombody">
      ${goals ? `<div class="sect"><div class="secth">Goals</div>
        ${goals.map((g,i)=>`<div class="goalrow"><b>${['Now','Next','Later'][i]||''}</b><span>${esc(g)}</span></div>`).join('')}
      </div>` : ''}
      ${ms.length ? `<div class="sect"><div class="secth">Milestones</div>
        <div class="scrollx"><table class="dt">
        <thead><tr><th>Ref</th><th>Milestone</th><th>Target</th><th>Execution</th>
          ${t==='j'?'<th>Agreement</th>':''}<th></th></tr></thead>
        <tbody>${ms.map(m => msRow(m, t)).join('')}</tbody></table></div>
      </div>` : ''}
      ${privCount ? privBlock(t, privCount) : ''}
      ${asms.length ? `<div class="sect"><div class="secth">Assumptions</div>
        ${asms.map(a=>`<div class="itemline"><span class="ref">${a.id}</span><span>
          ${esc(a.text)}<br><span class="tiny faint">confidence ${a.conf} &middot; test by ${a.testBy}
          &middot; carries ${a.carries.join(', ')}
          ${dstr(a.testBy) < TODAY ? ` &middot; <span style="color:var(--st-crit)">expired, ${a.cycles} cycles untested</span>` : ''}</span>
        </span></div>`).join('')}
      </div>` : ''}
      ${LOAD[t] && LOAD[t][d.code] ? `<div class="sect"><div class="secth">Hour demand</div>
        <div class="tiny muted">${LOAD[t][d.code]} hours in a normal week. Counted in the health audit.</div>
      </div>` : ''}
    </div>
  </div>`;
}

function msRow(m, t){
  const isJoint = t === 'j';
  const proposed = isJoint && m.agree === 'proposed';
  const canAct = proposed && m.by !== viewer;
  const isMine = proposed && m.by === viewer;
  const moved = (m.moves||[]).length >= 2;
  return `<tr>
    <td class="ref">${m.id}</td>
    <td class="nm">${esc(m.title)}
      ${m.note ? `<div class="tiny faint" style="margin-top:3px">${esc(m.note)}</div>` : ''}
      ${moved ? `<div class="movehist" style="margin-top:3px">moved ${m.moves.length-1}&times;: ${m.moves.map(fmtYM).join(' &rarr; ')}</div>` : ''}
      ${m.hist ? `<div class="tiny faint" style="margin-top:4px;font-family:var(--mono);font-size:.66rem">${
        m.hist.map(h=>`${h.e} by ${MEMBERS[h.who].name} ${h.at}`).join(' &middot; ')}</div>` : ''}</td>
    <td>${fmtYM(m.target)}</td>
    <td>${proposed
      ? `<span class="tiny faint">not yet</span>`
      : pill(m.s)}</td>
    ${isJoint ? `<td>${agreePill(m)}</td>` : ''}
    <td style="text-align:right">
      ${canAct ? `<div class="actbtns" style="justify-content:flex-end;margin-top:0">
          <button class="btn sm pri" data-agree="${m.id}" data-v="agreed">Agree</button>
          <button class="btn sm" data-agree="${m.id}" data-v="edit">Propose edit</button>
          <button class="btn sm" data-agree="${m.id}" data-v="discuss">Discuss</button>
        </div>` : ''}
      ${isMine ? `<div class="tiny faint" style="text-align:right">Waiting on ${MEMBERS[other(viewer)].name}</div>
        <div class="why" style="text-align:right;margin-left:auto">You proposed it, so you cannot agree it.</div>` : ''}
    </td>
  </tr>`;
}

function privBlock(t, n){
  const mine = t === viewer;
  if(mine) return `<div class="privrow">
    <span class="ref">PRIVATE</span>
    <span>${n} item${n===1?'':'s'} only you can see. ${MEMBERS[other(t)].name} sees the count and nothing else.
    Conflict checking compares them against the plan; anything it finds comes to you first.</span>
    <button class="btn sm" style="margin-left:auto" data-privlog="1">Access log</button></div>`;
  return `<div class="privrow">
    <span class="ref">PRIVATE</span>
    <span>${n} private item${n===1?'':'s'}. No titles, no dates, no placeholder rows.
    The count is all that crosses.</span></div>`;
}

/* ===================== MEMBERS ===================== */
function vMembers(){
  return `<h1 class="page">Members and privacy</h1>
  <p class="lede">Two principals today. A household holds up to 6 members, being at most
  2 principals and up to 4 dependants. Advisors sit outside that count, up to 4 of them, because
  an advisor is someone you grant a view rather than someone in the household.
  Adding anyone beyond the second member needs both principals to act.</p>

  <div class="card" style="margin-bottom:16px">
    <div class="cardhd"><h2>Household members</h2><span class="sub">2 of 6</span></div>
    <div class="scrollx"><table class="dt">
      <thead><tr><th>Member</th><th>Role</th><th>Track</th><th>Joint plan</th><th>Private-item conflict checks</th></tr></thead>
      <tbody>
      ${['o','l'].map(id=>`<tr>
        <td class="nm"><span class="pill" style="border-color:var(--track-${id})"><span class="sw" style="background:var(--track-${id})"></span>${MEMBERS[id].name}</span></td>
        <td>Principal</td><td>Owns</td><td>Co-owns, confirms</td>
        <td>Allowed, since 2026-05-02</td></tr>`).join('')}
      </tbody></table></div>
    <div class="tiny muted" style="margin-top:12px">
      <b>Allow private-item conflict checks.</b> Cairn may privately compare your private items
      against the household plan to spot conflicts. Your partner never sees the private item, and
      anything found comes to you first.</div>
    <div class="tiny faint" style="margin-top:8px">
      Each principal answered separately, in their own session. If either had declined, private
      items would be excluded from automated comparison for the whole household.</div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="cardhd"><h2>Roles available</h2></div>
      <div class="scrollx"><table class="dt">
        <thead><tr><th>Role</th><th>Max</th><th>Own track</th><th>Joint plan</th></tr></thead>
        <tbody>
          <tr><td class="nm">Principal</td><td>2</td><td>Yes</td><td>Co-owns, confirms</td></tr>
          <tr><td class="nm">Dependent</td><td>4</td><td>Yes</td><td>Reads, proposes, cannot confirm</td></tr>
          <tr><td class="nm">Advisor</td><td>4, outside the 6</td><td>No</td><td>Reads only what is granted</td></tr>
        </tbody></table></div>
      <p class="tiny faint" style="margin:12px 0 0">
        Advisor grants are scoped per track per domain, revocable, and expire after 90 days
        so a stale grant does not quietly persist for years.</p>
      <div class="hstat" style="margin-top:14px;border-top:1px solid var(--rule);padding-top:12px">
        <b>0</b><span>advisors, of 4. Separate from the 6 member slots.</span></div>
      <button class="btn" style="margin-top:14px" data-addmember="1">Add a member</button>
    </div>

    <div class="card">
      <div class="cardhd"><h2>Access log</h2><span class="sub">yours only</span></div>
      <p class="tiny muted" style="margin-top:0">Every automated access to your own private items.
      No content, since the content is already yours. Just the fact that it was read.</p>
      <div class="scrollx"><table class="dt">
        <thead><tr><th>When</th><th>Purpose</th><th>Run</th></tr></thead>
        <tbody>
          <tr><td class="nm">2026-08-24 03:12</td><td>Collision detection</td><td class="ref">run_8f21</td></tr>
          <tr><td class="nm">2026-08-17 03:11</td><td>Collision detection</td><td class="ref">run_7c04</td></tr>
          <tr><td class="nm">2026-08-10 03:12</td><td>Collision detection</td><td class="ref">run_6b93</td></tr>
        </tbody></table></div>
      <p class="tiny faint" style="margin:12px 0 0">Reviews, sessions, briefs and prep never load
      private items. Only conflict checking does, and anything it finds comes to you alone.</p>
    </div>
  </div>`;
}

/* ===================== LOGS ===================== */
function vLogs(){
  return `<h1 class="page">Logs</h1>
  <p class="lede">Review and session records, newest first. Entries are never edited.</p>
  <div class="card">
    ${REVIEWS.map(r=>`<div class="logrow">
      <div><div class="ref">${r.id}</div><div class="tiny faint">${r.date}</div></div>
      <div><div class="nm" style="font-weight:500">${esc(r.mode)}</div>
        <div class="tiny muted" style="margin-top:2px">${esc(r.note)}</div>
        <div class="tiny faint" style="margin-top:4px">${r.changed} status changes &middot; ${r.flagged} flagged</div>
      </div></div>`).join('')}

}

<script>
/* ===================== TIMELINE ===================== */
const TL = {
  start: 2026 + 7/12,        // Aug 2026
  months: 62,
  pxM: 17,
  padL: 14,
  headH: 64,
  laneH: 25,
  gGap: 12,
  labelW: 176
};
TL.width = TL.padL*2 + TL.months*TL.pxM;
TL.groupH = TL.laneH*3;
TL.height = TL.headH + DOMAINS.length*(TL.groupH + TL.gGap);

const LANES = ['o','j','l'];
const x = s => TL.padL + (ym(s) - TL.start) * 12 * TL.pxM;
const xNow = TL.padL + (todayY - TL.start) * 12 * TL.pxM;
function groupTop(i){ return TL.headH + i*(TL.groupH + TL.gGap); }
function laneY(di, t){ return groupTop(di) + LANES.indexOf(t)*TL.laneH; }
function markY(di, t){ return laneY(di, t) + TL.laneH/2; }
function markPos(id){
  const m = byId(id); if(!m) return null;
  const di = DOMAINS.findIndex(d => d.code === m.d);
  return {cx:x(m.target), cy:markY(di, m.t), m};
}
const laneShown = t => tlFilter === 'all' || tlFilter === t || (tlFilter !== 'all' && t === 'j' && tlFilter !== 'j') ? (tlFilter === 'all' || t === 'j' || t === tlFilter) : false;

function vTimeline(){
  return `<h1 class="page">Timeline</h1>
  <p class="lede">Seven domains, three lanes each, joint in the middle so dependency lines cross it.
  Colour carries state, lane position carries whose it is, and no status depends on colour alone.
  Tap or focus any mark for its detail; the plan views are the table version of this chart.</p>

  <div class="tlbar">
    <div class="seg" role="group" aria-label="Lane filter">
      ${[['all','All'],['o','Ona'],['j','Joint'],['l','Leroo']].map(([k,l])=>
        `<button data-tl="${k}" aria-pressed="${tlFilter===k}">${l}</button>`).join('')}
    </div>
    <div class="legend">
      ${['on_track','at_risk','slipped','blocked','done','parked'].map(s=>{
        const st = STATUS[s];
        return `<span><i class="lgsw" style="${st.fill?`background:${st.c}`:`background:transparent;border:2px solid ${st.c}`}"></i>${st.label}</span>`;
      }).join('')}
      <span><i class="lgsw" style="background:transparent;border:2px dashed var(--ink-faint)"></i>Proposed, not yet agreed</span>
    </div>
  </div>

  <div class="tlhost"><div style="display:flex;min-width:min-content">
    <div style="position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--rule-strong);flex:0 0 ${TL.labelW}px">
      ${tlLabels()}
    </div>
    ${tlSvg()}
  </div></div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <div class="cardhd"><h2>Open collisions</h2><span class="sub">oldest first</span></div>
      ${COLLISIONS.filter(c=>c.status==='open')
        .sort((a,b)=>dstr(a.opened)-dstr(b.opened)).map(c=>{
        const age = daysBetween(dstr(c.opened), TODAY);
        return `<div class="itemline"><span class="ref">${c.id}</span><span>
          <b>${esc(c.tension)}</b><br>
          <span class="tiny faint">${c.kind} gap &middot; ${c.tracks.map(trackName).join(' and ')}
          &middot; ${fmtYM(c.from)} to ${fmtYM(c.to)} &middot;
          <span style="${age>90?'color:var(--st-warn);font-weight:600':''}">open ${age} days</span></span><br>
          <span class="tiny muted">${c.kind==='information'?'Closes with a task. Assign it, do not debate it.'
            :c.kind==='weighting'?'Closes with a trade. Name what it costs the person who wants it less.'
            :'Does not close. File it as a standing constraint instead of relitigating it every quarter.'}</span>
        </span></div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="cardhd"><h2>Gates</h2><span class="sub">by decide-by date</span></div>
      ${GATES.map(g=>{
        const mo = Math.round((ym(g.by)-todayY)*12);
        return `<div class="itemline"><span class="ref">${g.id}</span><span>
          <b>${esc(g.title)}</b><br>
          <span class="tiny ${mo<=6&&!g.brief?'':'faint'}" style="${mo<=6&&!g.brief?'color:var(--st-crit)':''}">
          Decide by ${fmtYM(g.by)}, ${mo} months out &middot;
          ${g.brief?`brief ${g.brief} exists`:'no brief written'}</span><br>
          <span class="tiny faint">${g.tracks.map(trackName).join(', ')} &middot; ${g.domains.join(', ')}</span>
        </span></div>`;
      }).join('')}
      <div class="cardhd" style="margin-top:20px"><h2>Assumptions needing attention</h2></div>
      ${ASSUMPTIONS.filter(a=>a.conf==='low'||dstr(a.testBy)<TODAY)
        .sort((a,b)=>b.carries.length-a.carries.length).map(a=>
        `<div class="itemline"><span class="ref">${a.id}</span><span>
          ${esc(a.text)}<br><span class="tiny faint">carries ${a.carries.length} milestone${a.carries.length===1?'':'s'}
          &middot; confidence ${a.conf}
          ${dstr(a.testBy)<TODAY?` &middot; <span style="color:var(--st-crit)">expired ${a.testBy}</span>`:` &middot; test by ${a.testBy}`}</span>
        </span></div>`).join('')}
    </div>
  </div>`;
}

function tlLabels(){
  let h = `<div style="height:${TL.headH}px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;padding:0 12px 7px">
    <span class="ref" style="font-size:.64rem;letter-spacing:.12em;text-transform:uppercase">Domain / lane</span></div>`;
  DOMAINS.forEach((d,i)=>{
    h += `<div style="height:${TL.groupH}px;padding:0 12px;position:relative">
      <div style="position:absolute;top:3px;left:12px;font-family:var(--mono);font-size:.66rem;
        font-weight:600;letter-spacing:.09em;color:var(--brand)">${d.code}</div>
      <div style="position:absolute;top:${TL.laneH-3}px;left:12px;right:12px;font-size:.72rem;
        color:var(--ink-muted);line-height:1.25">${esc(d.short)}</div>
      ${LANES.map(t=>{
        const vis = tlFilter==='all' || tlFilter===t;
        return `<div style="position:absolute;right:10px;top:${LANES.indexOf(t)*TL.laneH + 5}px;
          font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;
          color:${t==='j'?'var(--ink-faint)':`var(--track-${t})`};opacity:${vis?1:.28}">
          ${t==='j'?'JOINT':MEMBERS[t].name.toUpperCase()}</div>`;
      }).join('')}
    </div><div style="height:${TL.gGap}px"></div>`;
  });
  return h;
}

function tlSvg(){
  const W = TL.width, H = TL.height;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Plan timeline by domain and track" style="display:block;flex:0 0 auto">
    <defs>
      <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y="0" x2="0" y2="7" stroke="var(--st-warn)" stroke-width="2.4" opacity=".28"/>
      </pattern>
    </defs>`;

  // horizon bands
  const bands = [['Now',0,6],['Next',6,24],['Later',24,62]];
  bands.forEach(([lab,a,b],i)=>{
    const x0 = TL.padL + (todayY - TL.start)*12*TL.pxM + a*TL.pxM;
    const x1 = Math.min(TL.padL + (todayY - TL.start)*12*TL.pxM + b*TL.pxM, W-TL.padL);
    s += `<rect x="${x0}" y="${TL.headH}" width="${Math.max(0,x1-x0)}" height="${H-TL.headH}"
      fill="var(--ink)" opacity="${0.028 - i*0.009}"/>
      <text x="${x0+6}" y="13" font-family="var(--mono)" font-size="8.5"
      letter-spacing="1.3" fill="var(--ink-faint)">${lab.toUpperCase()}</text>`;
  });

  // year gridlines + labels
  for(let yr=2027; yr<=2031; yr++){
    const gx = x(`${yr}-01`);
    s += `<line x1="${gx}" y1="${TL.headH-16}" x2="${gx}" y2="${H}" stroke="var(--rule-strong)" stroke-width="1"/>
      <text x="${gx+5}" y="${TL.headH-5}" font-family="var(--mono)" font-size="10"
      fill="var(--ink-muted)" font-variant-numeric="tabular-nums">${yr}</text>`;
    for(let q=4; q<12; q+=4){
      const qx = x(`${yr}-${String(q+1).padStart(2,'0')}`);
      if(qx < W) s += `<line x1="${qx}" y1="${TL.headH}" x2="${qx}" y2="${H}" stroke="var(--rule)" stroke-width="1"/>`;
    }
  }

  // lane backgrounds
  DOMAINS.forEach((d,di)=>{
    LANES.forEach(t=>{
      const vis = tlFilter==='all' || tlFilter===t;
      s += `<rect x="0" y="${laneY(di,t)}" width="${W}" height="${TL.laneH}"
        fill="${t==='j'?'var(--ink)':'var(--ink)'}" opacity="${t==='j'?0.022:0.008}"
        ${vis?'':'style="opacity:.004"'}/>`;
    });
    s += `<line x1="0" y1="${groupTop(di)+TL.groupH}" x2="${W}" y2="${groupTop(di)+TL.groupH}"
      stroke="var(--rule)" stroke-width="1"/>`;
  });

  // collision regions
  COLLISIONS.filter(c=>c.status==='open').forEach(c=>{
    c.domains.forEach(dc=>{
      const di = DOMAINS.findIndex(d=>d.code===dc); if(di<0) return;
      const lanes = c.tracks.length ? c.tracks : ['j'];
      const ys = lanes.map(t=>laneY(di,t));
      const y0 = Math.min(...ys), y1 = Math.max(...ys)+TL.laneH;
      s += `<rect x="${x(c.from)}" y="${y0}" width="${x(c.to)-x(c.from)}" height="${y1-y0}"
        fill="url(#hatch)" stroke="var(--st-warn)" stroke-width="1" stroke-dasharray="3 3" opacity=".85"
        class="hit" data-tip="collision:${c.id}" tabindex="0" role="button"
        aria-label="Collision ${c.id}"/>`;
    });
    const di0 = DOMAINS.findIndex(d=>d.code===c.domains[0]);
    s += `<text x="${x(c.from)+5}" y="${groupTop(di0)-3}" font-family="var(--mono)" font-size="8.5"
      fill="var(--st-crit)" font-weight="600" pointer-events="none">${c.id}</text>`;
  });

  // dependency lines
  DEPS.forEach(dep=>{
    const a = markPos(dep.from), b = markPos(dep.to);
    if(!a||!b) return;
    const vis = (tlFilter==='all') || [a.m.t,b.m.t].includes(tlFilter) || [a.m.t,b.m.t].includes('j');
    const up = a.m.s;
    const alert = up==='slipped'||up==='blocked';
    const cross = a.m.t !== b.m.t;
    const mx = (a.cx+b.cx)/2;
    s += `<path d="M ${a.cx} ${a.cy} C ${mx} ${a.cy}, ${mx} ${b.cy}, ${b.cx} ${b.cy}"
      fill="none" stroke="${alert?'var(--st-crit)':'var(--ink-faint)'}"
      stroke-width="${(dep.nature==='hard'?1.5:1) + (alert?.5:0) + (cross?.4:0)}"
      stroke-dasharray="${dep.nature==='hard'?'':'4 3'}"
      opacity="${vis?(alert?.9:.55):.12}"/>`;
  });

  // gates
  GATES.slice().sort((a,b)=>ym(a.by)-ym(b.by)).forEach((g,gi)=>{
    const gx = x(g.by);
    const mo = Math.round((ym(g.by)-todayY)*12);
    const urgent = mo<=6 && !g.brief;
    const ry = 20 + (gi % 2) * 19;                 // stagger so adjacent gate labels never collide
    const col = urgent ? 'var(--st-crit)' : 'var(--brand)';
    s += `<line x1="${gx}" y1="${ry}" x2="${gx}" y2="${H}" stroke="${col}"
      stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>
      <rect x="${gx-2}" y="${ry}" width="${g.id.length*6.4+50}" height="15" rx="3"
        fill="var(--surface)" stroke="${col}" stroke-width="1"
        class="hit" data-tip="gate:${g.id}" tabindex="0" role="button"
        aria-label="Gate ${g.id}, decide by ${g.by}"/>
      <text x="${gx+4}" y="${ry+11}" font-family="var(--mono)" font-size="8.5"
        fill="${col}" font-weight="600" pointer-events="none">${g.id} ${g.by}</text>`;
  });

  // today
  s += `<line x1="${xNow}" y1="${TL.headH-16}" x2="${xNow}" y2="${H}" stroke="var(--ink)" stroke-width="2"/>
    <text x="${xNow+5}" y="${TL.headH-5}" font-family="var(--mono)" font-size="9"
      fill="var(--ink)" font-weight="600">TODAY</text>`;

  // milestones
  DOMAINS.forEach((d,di)=>{
    LANES.forEach(t=>{
      const vis = tlFilter==='all' || tlFilter===t;
      M.filter(m=>m.d===d.code && m.t===t).forEach((m, idx, arr)=>{
        const cx = x(m.target);
        let cy = markY(di,t);
        if(arr.length>1){
          const clash = arr.filter((o,j)=>j<idx && Math.abs(x(o.target)-cx) < 16).length;
          cy += clash * 8 - (clash?4:0);
        }
        const st = STATUS[execOf(m)];
        const op = vis ? 1 : .14;
        // slippage ghosts
        (m.moves||[]).slice(0,-1).forEach(mv=>{
          s += `<circle cx="${x(mv)}" cy="${cy}" r="4" fill="none" stroke="var(--st-crit)"
            stroke-width="1" opacity="${op*.45}"/>
            <line x1="${x(mv)}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="var(--st-crit)"
            stroke-width="1" stroke-dasharray="2 2" opacity="${op*.4}"/>`;
        });
        const unconf = m.t==='j' && m.agree==='proposed';
        const label = m.id.slice(2);
        const room = !arr.some((o,j)=>{
          if(j===idx) return false;
          const dx = x(o.target) - cx;
          return dx > 0 && dx < label.length*5.4 + 20;
        });
        s += `<circle cx="${cx}" cy="${cy}" r="6.5"
          fill="${st.fill?st.c:'var(--surface)'}"
          stroke="${unconf?'var(--ink-faint)':st.c}"
          stroke-width="${unconf?2:(st.fill?1.5:2)}"
          stroke-dasharray="${unconf?'3 2':''}"
          opacity="${op}" class="hit" data-tip="ms:${m.id}" tabindex="0" role="button"
          aria-label="${esc(m.title)}, ${trackName(m.t)}, ${fmtYM(m.target)}"/>
          ${room ? `<text x="${cx+11}" y="${cy+3.5}" font-family="var(--mono)" font-size="8.5"
            fill="var(--ink-faint)" opacity="${op}" pointer-events="none"
            ${m.s==='dropped'?'text-decoration="line-through"':''}>${label}</text>` : ''}`;
      });
    });
  });
  return s + `</svg>`;
}
</script>
<script>
/* ===================== DECISION ===================== */
function totals(who){
  const w = liveW[who], sum = Object.values(w).reduce((a,b)=>a+b,0);
  return DEC.options.map(o=>{
    const raw = DEC.criteria.reduce((a,c)=> a + DEC.scores[o.k][c.k]*w[c.k], 0);
    return {k:o.k, label:o.label, raw, pct: sum ? raw/(5*sum)*100 : 0};
  }).sort((a,b)=>b.pct-a.pct);
}
function sensitivity(who){
  const base = totals(who), win = base[0].k, out = [];
  DEC.criteria.forEach(c=>{
    const keep = liveW[who][c.k];
    liveW[who][c.k] = Math.min(60, keep+10);
    if(totals(who)[0].k !== win) out.push({c:c.label, dir:'up'});
    liveW[who][c.k] = Math.max(0, keep-10);
    if(totals(who)[0].k !== win && !out.find(x=>x.c===c.label)) out.push({c:c.label, dir:'down'});
    liveW[who][c.k] = keep;
  });
  return out;
}
function scoreFlip(who){
  const base = totals(who), win = base[0].k;
  for(const o of DEC.options) for(const c of DEC.criteria){
    const keep = DEC.scores[o.k][c.k];
    for(const d of [1,-1]){
      const v = keep + d; if(v<1||v>5) continue;
      DEC.scores[o.k][c.k] = v;
      const flip = totals(who)[0].k !== win;
      DEC.scores[o.k][c.k] = keep;
      if(flip) return {opt:o.k, crit:c.label, dir:d>0?'up':'down'};
    }
  }
  return null;
}

function vDecision(){
  const me = viewer, them = other(viewer);
  const tMe = totals(me), tThem = totals(them);
  const margin = tMe[0].pct - tMe[1].pct;
  const tie = margin < 8;
  const sameWinner = tMe[0].k === tThem[0].k;
  const sens = sensitivity(me);
  const sflip = scoreFlip(me);
  const budget = Object.values(liveW[me]).reduce((a,b)=>a+b,0);
  const left = 100 - budget;
  const balanced = budget === 100;

  return `<h1 class="page">${DEC.id}: ${esc(DEC.title)}</h1>
  <p class="lede">${esc(DEC.question)}</p>

  <button class="btn sm" data-route="decisions" style="margin-bottom:16px">&larr; All decisions</button>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="tile"><div class="k">Scope</div><div class="v" style="font-size:1.2rem;padding-top:9px">Joint</div>
      <div class="n">Neither of you decides it alone</div></div>
    <div class="tile"><div class="k">Decide by</div><div class="v" style="font-size:1.2rem;padding-top:9px">${fmtYM(DEC.decideBy)}</div>
      <div class="n">Gate ${DEC.gate}, ${Math.round((ym(DEC.decideBy)-todayY)*12)} months out</div></div>
    <div class="tile"><div class="k">Weights set</div><div class="v" style="font-size:1.2rem;padding-top:9px">Separately</div>
      <div class="n">Before any option was scored</div></div>
  </div>

  <div class="quiet" style="margin-bottom:16px">
    <b>Staging is a real option, not a delay.</b> ${esc(DEC.stageRule)}
    Gate ${DEC.gate} accordingly resolves to one of: ${GATES.find(g=>g.id===DEC.gate).outcomes.join(', ')}.
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="cardhd"><h2>Your weights</h2>
      <span class="sub"><span class="budget ${balanced?'':'over'}">${budget} of 100 allocated${
        balanced ? '' : `, ${left > 0 ? left + ' left to place' : Math.abs(left) + ' over'}`}</span></span></div>
    <p class="tiny muted" style="margin-top:0">You have 100 points. Where you put them is what
    reveals what matters. Raising one criterion means taking those points from another, which is
    the trade the method exists to make explicit. ${MEMBERS[them].name}'s 100 are hers and do not
    move when yours do.</p>
    <div class="scrollx"><table class="wgrid">
      <thead><tr><th>Criterion</th><th>Derived from</th><th style="width:210px">${MEMBERS[me].name} (you)</th>
        <th style="width:90px">${MEMBERS[them].name}</th></tr></thead>
      <tbody>${DEC.criteria.map(c=>`<tr>
        <td>${esc(c.label)}</td>
        <td class="ref">${c.from}</td>
        <td><div class="wcell">
          <input type="range" min="0" max="45" step="1" value="${liveW[me][c.k]}" data-w="${c.k}"
            aria-label="Weight for ${esc(c.label)}">
          <output>${liveW[me][c.k]}</output></div></td>
        <td class="num faint">${liveW[them][c.k]}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <button class="btn sm" style="margin-top:12px" data-wreset="1">Reset to the weights we set</button>
  </div>

  ${!balanced ? `<div class="card" style="margin-bottom:16px;border-color:var(--st-warn)">
    <div class="cardhd"><h2>Matrix held</h2><span class="sub">${Math.abs(left)} points ${left>0?'unplaced':'over'}</span></div>
    <p class="tiny muted" style="margin:0">The matrix runs on exactly 100 points. Scoring against
    a different total quietly turns "allocate 100" into "assign whatever importance you like",
    and those are two different methods with two different meanings.
    ${left > 0 ? `Place the remaining ${left}` : `Take ${Math.abs(left)} back off something`}
    and it will run.</p>
  </div>` : ''}

  <div class="card" style="margin-bottom:16px;${balanced?'':'opacity:.4;pointer-events:none'}">
    <div class="cardhd"><h2>Matrix</h2><span class="sub">scores 1 to 5, weighted, as percent of maximum</span></div>
    <div class="scrollx"><table class="wgrid">
      <thead><tr><th>Option</th>
        ${DEC.criteria.map(c=>`<th class="num" style="text-align:right">${c.k.toUpperCase()}</th>`).join('')}
        <th class="num" style="text-align:right">${MEMBERS[me].name}</th>
        <th class="num" style="text-align:right">${MEMBERS[them].name}</th></tr></thead>
      <tbody>${DEC.options.map(o=>{
        const rMe = tMe.find(r=>r.k===o.k), rThem = tThem.find(r=>r.k===o.k);
        const winMe = tMe[0].k===o.k, winThem = tThem[0].k===o.k;
        return `<tr>
          <td class="nm" style="color:var(--ink)">${esc(o.label)}${o.sq?' <span class="ref">status quo</span>':''}</td>
          ${DEC.criteria.map(c=>`<td class="num">${DEC.scores[o.k][c.k]}</td>`).join('')}
          <td class="num" style="${winMe?'font-weight:600;color:var(--ink)':''}">${rMe.pct.toFixed(1)}${winMe?' &#9664;':''}</td>
          <td class="num" style="${winThem?'font-weight:600;color:var(--ink)':''}">${rThem.pct.toFixed(1)}${winThem?' &#9664;':''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="nocombine">
      There is no combined column, and there is no place in the schema to store one.
      Averaging two people's weights produces a preference neither of you holds.
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="cardhd"><h2>What the current model suggests</h2>
        <span class="sub">evidence, not the decision</span></div>
      <div class="winner">
        <div style="font-weight:600">${sameWinner
          ? `Under your current weights and scores, both of you rank ${esc(tMe[0].label)} first.`
          : `Under your current weights and scores you rank ${esc(tMe[0].label)} first and ${MEMBERS[them].name} ranks ${esc(tThem[0].label)} first.`}</div>
        <div class="tiny muted" style="margin-top:5px">${sameWinner
          ? 'Agreement here follows from the inputs, so it is worth checking the inputs before treating it as settled.'
          : 'A difference in ranking is itself information. It goes to the partner session as a weighting gap, and weighting gaps close with a trade rather than with arithmetic.'}
          <br>This is evidence for the conversation, not the decision itself.</div>
      </div>
      <div style="margin-top:16px">
        <div class="secth">Margin, your weights</div>
        <div class="tiny ${tie?'':'muted'}" style="${tie?'color:var(--st-crit)':''}">
          ${tMe[0].pct.toFixed(1)} against ${tMe[1].pct.toFixed(1)}, ${margin.toFixed(1)} apart.
          ${tie ? 'Inside the 8 point band, which is inside the noise of a 1 to 5 scale. Treat it as a tie and decide on reversibility instead: take the option that is cheaper to undo and set the date you review it.'
                : 'Outside the tie band, so the ranking is not an artefact of small differences in scoring.'}</div>
      </div>
      <div style="margin-top:16px">
        <div class="secth">Largest weighting gap</div>
        <div class="tiny muted">${(()=>{
          let big = DEC.criteria[0], d = 0;
          DEC.criteria.forEach(c=>{const g=Math.abs(liveW[me][c.k]-liveW[them][c.k]); if(g>d){d=g;big=c;}});
          return `${esc(big.label)}, ${d} points apart. Worth naming out loud before anything closes.`;
        })()}</div>
      </div>
    </div>

    <div class="card">
      <div class="cardhd"><h2>Sensitivity</h2><span class="sub">mandatory, not optional</span></div>
      <div class="secth">Weight flip</div>
      <div class="tiny muted">${sens.length
        ? sens.slice(0,3).map(s=>`If you moved <b>${esc(s.c)}</b> 10 points ${s.dir}, the winner changes.`).join('<br>')
        : 'No single weight moved 10 points changes the winner. The result is stable against your weighting.'}</div>
      <div class="secth" style="margin-top:16px">Score flip</div>
      <div class="tiny ${sflip?'':'muted'}" style="${sflip?'color:var(--st-crit)':''}">${sflip
        ? `One cell moved one point changes the winner: option ${sflip.opt}, ${esc(sflip.crit)}, ${sflip.dir}. The ranking rests on a single judgement call, so treat it as provisional.`
        : 'No single cell moved one point changes the winner.'}</div>
      <div class="secth" style="margin-top:16px">Reversibility</div>
      <div class="tiny muted">Staging is the cheapest to undo and the status quo is free to undo but expensive to hold. Committing is the only one that is hard to reverse, and it is the one with the earliest deadline.</div>
    </div>
  </div>`;
}

/* ===================== SESSION ===================== */
/* single source of truth: elapsed minutes. Block state is computed, never stored. */
function sessionState(){
  const s = SESSION, cutoff = s.cutoff;
  let start = 0;
  const rows = s.blocks.map(b => {
    const row = {b, start, end: start + b.min};
    start += b.min;
    return row;
  });
  const cur = rows.find(r => s.elapsed >= r.start && s.elapsed < r.end) || rows[rows.length-1];
  rows.forEach(r => {
    r.k = r === cur ? 'cur' : (r.b.brk ? 'break' : (r.end <= s.elapsed ? 'done' : ''));
  });
  return {
    rows, cur, cutoff,
    elapsed: s.elapsed, total: s.total,
    remainingInBlock: cur.end - s.elapsed,
    toCutoff: cutoff - s.elapsed,
    cutoffRow: rows.find(r => cutoff >= r.start && cutoff < r.end)
  };
}

function vSession(){
  const s = SESSION;
  const S = sessionState();
  const rows = S.rows, cutoff = S.cutoff;
  return `<h1 class="page">Partner strategy session</h1>
  <p class="lede">210 minutes, quarterly. The app runs the clock, calls the breaks, and closes
  the door on new heavy items at minute 150.</p>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="tile"><div class="k">Elapsed</div><div class="v">${S.elapsed}<span style="font-size:.9rem;color:var(--ink-muted)"> min</span></div>
      <div class="n">of ${S.total}</div></div>
    <div class="tile"><div class="k">Current block</div>
      <div class="v" style="font-size:1.2rem;padding-top:9px">${esc(S.cur.b.label.split(',')[0])}</div>
      <div class="n">${S.remainingInBlock} minutes remaining of ${S.cur.b.min}</div></div>
    <div class="tile"><div class="k">New items close at</div><div class="v" style="font-size:1.2rem;padding-top:9px">Minute ${cutoff}</div>
      <div class="n">${S.toCutoff} minutes from now</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="cardhd"><h2>Blocks</h2><span class="sub">heaviest first</span></div>
      <div class="blocks">${rows.map(r=>`
        <div class="blk" data-k="${r.k}">
          <span class="bn">${r.b.n||'&middot;'}</span>
          <span>${esc(r.b.label)}${r.k==='cur'
            ? ` <span class="ref">${S.remainingInBlock}m left</span>` : ''}</span>
          <span class="bm">${r.b.min}m &middot; ends ${r.end}</span>
        </div>
        ${r === S.cutoffRow ? `<div class="gateline"><span class="ref">MIN ${cutoff}</span>
            <span>Minute ${cutoff} falls ${cutoff - r.start} minutes into <b>${esc(r.b.label)}</b>.
            Nothing new opens after it. What is left closes items already most of the way there.</span>
          </div>` : ''}
      `).join('')}</div>
    </div>

    <div class="card">
      <div class="cardhd"><h2>Live</h2>
        <span class="sub">block ${S.cur.b.n || '&middot;'} of ${SESSION.blocks.filter(b=>b.n).length}</span></div>
      <div class="transcript">
        ${s.transcript.map(t=>`<div class="turn ${t.sys?'sys':''}">
          <span class="who">${t.sys?'Cairn':esc(t.who)}</span><p>${esc(t.text)}</p></div>`).join('')}
      </div>
      <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
        <button class="btn pri" data-resolve="X-01" data-kind="accept">Close X-01 as accepted</button>
        <button class="btn" data-resolve="X-01" data-kind="decide">Resolve with a decision</button>
        <button class="btn" data-resolve="X-01" data-kind="open">Leave open, next step</button>
      </div>
      <p class="why">Closing requires a kind, a cost, and an owner. An open collision with no
