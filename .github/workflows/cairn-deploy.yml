name: Deploy Cairn to Vercel

# The Claude Code environment that builds Cairn cannot reach api.vercel.com or
# api.supabase.com: the organization's egress policy denies both at the CONNECT
# stage. GitHub runners are not restricted, so the deploy runs here and the
# credentials live in repository secrets rather than in a terminal history.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy to production or a preview
        type: choice
        options: [production, preview]
        default: production
  push:
    branches:
      - main
    paths:
      - 'cairn/**'
      - '.github/workflows/cairn-deploy.yml'

concurrency:
  group: cairn-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than latest: every flag below was verified against this
  # version, and a CLI that changes an option name should fail review, not a
  # production deploy.
  VERCEL_CLI_VERSION: '59.5.0'
  TARGET: ${{ github.event.inputs.environment || 'production' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn

    # Whether a deploy is even possible. Checked here because the secrets
    # context is not available in a job level if, and a repository with no
    # token yet should skip the deploy rather than fail it: a red cross on
    # main that means "not configured" trains people to ignore red crosses.
    outputs:
      has_token: ${{ steps.token.outputs.present }}

    # The row level policies are the enforcement mechanism for every privacy and
    # authorship rule in Cairn, so the suite that proves them runs against a real
    # Postgres here. Skipping them would let a green run mean nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: cairn/.nvmrc
          cache: npm
          cache-dependency-path: cairn/package-lock.json

      - name: Look for a Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set, so the deploy will be skipped. The checks still run."
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check for method values written as literals
        run: npm run check:literals

      - name: Apply migrations to the test database
        env:
          DIRECT_URL: postgres://cairn:cairn@localhost:5432/cairn
        run: npm run db:push

      - name: Give the application role a password
        env:
          DIRECT_URL: postgres://cairn:cairn@localhost:5432/cairn
        run: |
          node -e '
            const postgres = require("postgres");
            const sql = postgres(process.env.DIRECT_URL, { max: 1 });
            sql.unsafe("alter role cairn_app with login password $$cairn_app$$")
              .then(() => sql.end())
              .catch(async (e) => { console.error(e.message); await sql.end(); process.exit(1); });
          '

      - name: Test, including the row level security suite
        env:
          DIRECT_URL: postgres://cairn:cairn@localhost:5432/cairn
          DATABASE_URL: postgres://cairn_app:cairn_app@localhost:5432/cairn
        run: npm test

  deploy:
    name: Build and deploy
    needs: verify
    if: needs.verify.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    # No environment: key on purpose. An environment scopes its own secrets to
    # jobs that name it, and the token check lives in the verify job, which does
    # not. A token added as an environment secret would be invisible there, the
    # gate above would read false, and the deploy would skip forever with
    # nothing on screen to say why. Every secret here is a repository secret.
    #
    # To add a manual approval before production later, create an environment
    # with a required reviewer, name it here, and move VERCEL_TOKEN's presence
    # check into this job.
    defaults:
      run:
        working-directory: cairn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: cairn/.nvmrc
          cache: npm
          cache-dependency-path: cairn/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the Vercel CLI
        run: npm i -g "vercel@${VERCEL_CLI_VERSION}"

      - name: Create the project if it does not exist, then link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: ${{ vars.VERCEL_PROJECT_NAME || 'cairn' }}
          SCOPE: ${{ vars.VERCEL_TEAM }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not set. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          scope_args=()
          [ -n "${SCOPE:-}" ] && scope_args=(--scope "$SCOPE")

          # Fails harmlessly when the project is already there, which is the
          # ordinary case on every run after the first.
          vercel project add "$PROJECT" --token "$VERCEL_TOKEN" "${scope_args[@]}" \
            || echo "Project $PROJECT already exists, continuing."

          vercel link --yes --project "$PROJECT" --token "$VERCEL_TOKEN" "${scope_args[@]}"

      # Only writes a variable whose secret is actually set, so a half
      # configured project is never overwritten with empty values.
      - name: Sync environment variables from repository secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.CAIRN_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CAIRN_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CAIRN_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CAIRN_ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CAIRN_CRON_SECRET }}
        run: |
          set -euo pipefail
          sync() {
            local name="$1" value="$2" sensitivity="$3"
            if [ -z "$value" ]; then
              echo "skip  $name, no secret set"
              return
            fi
            vercel env add "$name" "$TARGET" \
              --value "$value" --force "$sensitivity" \
              --token "$VERCEL_TOKEN" >/dev/null
            echo "set   $name"
          }
          # The anon key and the project URL are public by design: they reach the
          # browser, and they grant nothing on their own because authorization
          # lives in the database.
          sync DATABASE_URL "${DATABASE_URL:-}" --sensitive
          sync NEXT_PUBLIC_SUPABASE_URL "${NEXT_PUBLIC_SUPABASE_URL:-}" --no-sensitive
          sync NEXT_PUBLIC_SUPABASE_ANON_KEY "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" --no-sensitive
          sync ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}" --sensitive
          sync CRON_SECRET "${CRON_SECRET:-}" --sensitive

      - name: Pull the project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="$TARGET" --token "$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            vercel build --token "$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check what the deployment reports about itself
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          body=$(curl -sS --max-time 30 -L "$url/sign-in" || true)
          if printf '%s' "$body" | grep -q "Not configured yet"; then
            echo "::warning::Deployed, but the environment is incomplete. The site names what is missing."
          elif printf '%s' "$body" | grep -q "Refusing to serve"; then
            echo "::error::DATABASE_URL connects as a role that can bypass row level security."
            exit 1
          else
            echo "The deployment is serving normally."
          fi

      - name: Summarise
        run: |
          {
            echo "### Cairn deployed"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Migrations are a separate workflow and never run on deploy."
          } >> "$GITHUB_STEP_SUMMARY"
